{% extends "base.html" %}


{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="page-title mb-0">Dashboard</h4>
  <span class="text-muted" style="font-size:.85rem">Semestre 2025.1</span>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-3">
    <div class="metric-card">
      <div class="metric-label">Disciplinas</div>
      <div class="metric-value text-primary">—</div>
      <div class="metric-sub text-muted">cadastradas</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="metric-card">
      <div class="metric-label">Salas ativas</div>
      <div class="metric-value text-success">—</div>
      <div class="metric-sub text-muted">disponíveis</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="metric-card">
      <div class="metric-label">Professores</div>
      <div class="metric-value text-primary">—</div>
      <div class="metric-sub text-muted">cadastrados</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="metric-card">
      <div class="metric-label">Conflitos</div>
      <div class="metric-value text-danger">—</div>
      <div class="metric-sub text-danger-soft">requerem atenção</div>
    </div>
  </div>
</div>

<p class="text-muted">Configure as alocações nos menus acima.</p>
{% endblock %}
