<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SisAloc{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">

  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center gap-6">
    <span class="font-bold text-white text-xl tracking-tight">SisAloc</span>
    <div class="flex gap-4 text-sm">
      <a href="{% url 'relatorios:dashboard' %}" class="text-slate-300 hover:text-white transition-colors">Dashboard</a>
      <a href="{% url 'relatorios:professores' %}" class="text-slate-300 hover:text-white transition-colors">Professores</a>
      <a href="{% url 'relatorios:salas' %}" class="text-slate-300 hover:text-white transition-colors">Salas</a>
      <a href="{% url 'relatorios:grade' %}" class="text-slate-300 hover:text-white transition-colors">Grade</a>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
