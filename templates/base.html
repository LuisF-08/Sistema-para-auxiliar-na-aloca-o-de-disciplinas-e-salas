<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SADAS - Alocação Acadêmica{% endblock %}</title>
  
  <!-- Carrega as tags de arquivos estáticos do Django -->
  {% load static %}
  
  <!-- CSS do Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Ícones do Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Arquivo de estilos base do seu grupo -->
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>

  <!-- 1. BARRA LATERAL  -->
  <aside class="sidebar">
    
    <!-- Cabeçalho / Brand -->
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon text-white">
        <i class="bi bi-calendar3"></i>
      </div>
      <div class="sidebar-brand-text">
        <strong>SADAS</strong>
        <span>Alocação Acadêmica</span>
      </div>
    </div>
    
    <!-- Links de Navegação -->
    <div class="overflow-y-auto flex-grow-1">
      
      <!-- SEÇÃO: GERAL -->
      <div class="sidebar-section-label">Geral</div>
      <nav class="nav flex-column">
        <a href="{% url 'alocacao:dashboard' %}" class="nav-link active">
          <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="{% url 'relatorios:grade' %}" class="nav-link">
          <i class="bi bi-calendar-week"></i> Grade Horária
        </a>
        <a href="#" class="nav-link">
          <i class="bi bi-plus-lg"></i> Nova Alocação
        </a>
      </nav>

      <!-- SEÇÃO: CADASTROS -->
      <div class="sidebar-section-label">Cadastros</div>
      <nav class="nav flex-column">
        <a href="{% url 'academico:disciplina_list' %}" class="nav-link">
          <i class="bi bi-book"></i> Disciplinas
        </a>
        <a href="{% url 'pessoas:professor_list' %}" class="nav-link">
          <i class="bi bi-people"></i> Professores
        </a>
        <a href="{% url 'infraestrutura:sala_list' %}" class="nav-link">
          <i class="bi bi-building"></i> Salas
        </a>
        <a href="{% url 'pessoas:turma_list' %}" class="nav-link">
  <i class="bi bi-mortarboard"></i> Turmas
</a>
      </nav>

      <!-- SEÇÃO: SISTEMA -->
      <div class="sidebar-section-label">Sistema</div>
      <nav class="nav flex-column">
        <a href="#" class="nav-link">
          <i class="bi bi-exclamation-triangle"></i> Conflitos
          <span class="sidebar-badge">3</span>
        </a>
        <a href="#" class="nav-link">
          <i class="bi bi-bar-chart-line"></i> Relatórios
        </a>
      </nav>
    </div>

    <!-- Rodapé do Usuário Logado -->
    <div class="sidebar-footer">
      <div class="sidebar-avatar">F</div>
      <div class="sidebar-user">
        <strong>Cordenador</strong>
        <span></span>
      </div>
    </div>
  </aside>

  <!-- 2. CONTEÚDO PRINCIPAL  -->
  <div class="main-with-sidebar">
    
    <!-- Topbar Oficial do Layout -->
    <header class="topbar d-flex justify-content-between align-items-center">
      <div class="breadcrumb-text">
        SADAS &nbsp;/&nbsp; <strong>Dashboard</strong>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="semestre-badge">Semestre 2025.2</span>
        <i class="bi bi-bell text-muted cursor-pointer fs-5"></i>
      </div>
    </header>

    <!-- Miolo da Página -->
    <main class="p-4">
      {% block content %}
      {% endblock %}
    </main>
  </div>

  <!-- Scripts do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
