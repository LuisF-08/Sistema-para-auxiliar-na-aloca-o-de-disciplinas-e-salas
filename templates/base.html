<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SADAS - Alocação Acadêmica{% endblock %}</title>
  
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>

  <aside class="sidebar">
    
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon text-white">
        <i class="bi bi-calendar3"></i>
      </div>
      <div class="sidebar-brand-text">
        <strong>SADAS</strong>
        <span>Alocação Acadêmica</span>
      </div>
    </div>
    <div class="overflow-y-auto flex-grow-1">
      
      <!-- SEÇÃO: GERAL -->
      <div class="sidebar-section-label">Geral</div>
      <nav class="nav flex-column">
        <a href="{% url 'alocacao:dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
          <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="{% url 'alocacao:grade_horaria' %}" class="nav-link {% if request.resolver_match.url_name == 'grade_horaria' %}active{% endif %}">
          <i class="bi bi-calendar-week"></i> Grade Horária
        </a>
        <a href="{% url 'alocacao:alocacoes' %}" class="nav-link {% if request.resolver_match.url_name == 'alocacoes' %}active{% endif %}">
          <i class="bi bi-plus-lg"></i> Nova Alocação
        </a>
      </nav>

      <!-- SEÇÃO: CADASTROS -->
      <div class="sidebar-section-label">Cadastros</div>
      <nav class="nav flex-column">
        <a href="{% url 'academico:disciplina_list' %}" class="nav-link {% if request.resolver_match.url_name == 'disciplina_list' %}active{% endif %}">
          <i class="bi bi-book"></i> Disciplinas
        </a>
        <a href="{% url 'pessoas:professor_list' %}" class="nav-link {% if request.resolver_match.url_name == 'professor_list' %}active{% endif %}">
          <i class="bi bi-people"></i> Professores
        </a>
        <a href="{% url 'infraestrutura:sala_list' %}" class="nav-link {% if request.resolver_match.url_name == 'sala_list' %}active{% endif %}">
          <i class="bi bi-building"></i> Salas
        </a>
        <a href="{% url 'pessoas:turma_list' %}" class="nav-link {% if request.resolver_match.url_name == 'turma_list' %}active{% endif %}">
  <i class="bi bi-mortarboard"></i> Turmas
          <a href="{% url 'academico:curso_list' %}" class="nav-link text-white">
    <i class="bi bi-journal-bookmark-fill me-2"></i> Cursos
          </a
</a>
      </nav>

      <!-- SEÇÃO: SISTEMA -->
      <div class="sidebar-section-label">Sistema</div>
      <nav class="nav flex-column">
        <a href="#" class="nav-link">
          <i class="bi bi-exclamation-triangle"></i> Conflitos
          <span class="sidebar-badge">3</span>
        </a>
        <a href="{% url 'relatorios:professores' %}" class="nav-link">
          <i class="bi bi-bar-chart-line"></i> Relatórios
        </a>
      </nav>
    </div>

    <!-- Rodapé do Usuário Logado  (EM BREVE COM USUARIOS)-->
    <div class="sidebar-footer">
      <div class="sidebar-avatar">F</div>
      <div class="sidebar-user">
        <strong>Cordenador</strong>
        <span></span>
      </div>
    </div>
  </aside>

  <!-- 2. CONTEÚDO PRINCIPAL  -->
  <div class="main-with-sidebar">
    
    <header class="topbar d-flex justify-content-between align-items-center">
      <div class="breadcrumb-text">
        SADAS &nbsp;/&nbsp; <strong></strong>
      </div>
      <div class="d-flex align-items-center gap-3">
       <span class="badge bg-primary-subtle text-primary px-3 py-2 fw-semibold" style="border-radius: 8px; font-size: 13px;">
        Semestre {{ semestre_atual|default:"2026.2"}}
      </span>
        <i class="bi bi-bell text-muted cursor-pointer fs-5"></i>
      </div>
    </header>

    <main class="p-4">
      {% block content %}
      {% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html
