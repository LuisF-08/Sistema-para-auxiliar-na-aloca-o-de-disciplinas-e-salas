<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Sistema de Alocação de Disciplinas e Salas{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/custom.css' %}"/>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">Sistema de Alocação de Disciplinas e Salas</a>
      <div class="navbar-nav ms-auto">
        {# <a class="nav-link" href="{% url 'academico:disciplina_list' %}">Disciplinas</a> #}
        <a class="nav-link" href="{% url 'pessoas:professor_list' %}">Professores</a>
        {# <a class="nav-link" href="{% url 'infraestrutura:sala_list' %}">Salas</a> #}
        {# <a class="nav-link" href="{% url 'alocacao:alocacao_list' %}">Alocações</a> #}
      </div>
    </div>
  </nav>

  <div class="container-fluid py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
